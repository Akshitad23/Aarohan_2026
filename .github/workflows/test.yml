name: Event checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aarohan_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_ADMIN_TEST_URL: postgresql://aarohan_test:local-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/rehearse_event.py --teams 40
      - run: for source in frontend/js/*.js; do node --check "$source"; done
      - run: node tests/frontend_smoke.cjs
