<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Organiser login | AI: Think. Hack. Create.
    </title>
    <link rel="preload" href="/assets/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/event.css">
    <script defer src="/js/api.js">
    </script>
    <script defer src="/js/auth.js">
    </script>
  </head>
  <body class="login-page">
    <header>
      <div class="topbar">
        <a class="brand" href="/">
          <span class="brand-context">AI: THINK. HACK. CREATE.</span>
          <span class="brand-title">EVENT CONTROL</span>
        </a>
        <nav>
          <a href="/">
            Team registration
          </a>
        </nav>
      </div>
    </header>
    <main class="narrow">
      <div class="eyebrow">
        EVENT CONTROL
      </div>
      <h1>
        Organiser login
      </h1>
      <section class="panel">
        <form id="loginForm">
          <label for="username">
            Username
          </label>
          <input id="username" name="username" autocomplete="username" required value="admin">
          <label for="password">
            Password
          </label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p id="loginError" class="message error" role="alert"></p>
          <div class="actions">
            <button type="submit" id="loginButton">
              Log in
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
